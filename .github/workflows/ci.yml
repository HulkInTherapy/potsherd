name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        node: ['22', '24']
    steps:
      # `fetch-depth: 0` AND `fetch-tags: true`, and neither is decoration —
      # VERIFICATION-5 C-10.
      #
      # `tests/terminal.test.ts` asserts that VERSION is not behind the newest
      # tag this repository released, because at tag `v0.7.0` the binary printed
      # `0.4.0`. It asks `git tag --list 'v[0-9]*' --merged HEAD`. On the bare
      # `actions/checkout@v4` this step used to be, that comes back **empty** on
      # every run: the default is a depth-1 checkout with `--no-tags`. The test
      # then took its "the environment did not provide the premise" escape, and
      # vitest reported that escape as a **pass** — a green tick on an
      # assertion that had never once been evaluated.
      #
      # `fetch-tags: true` on its own does not fix it. Measured against this
      # repository over `file://`, which is the same fetch machinery a runner
      # uses:
      #
      #   fetch-depth  fetch-tags   v-tags   --merged HEAD   .git    fetch
      #   1 (default)  false            0               0   3.5M    0.52s
      #   1            true             0               0   3.5M    0.50s
      #   0            false            0               0   5.9M    2.07s
      #   0            true             9               9   5.9M    1.48s
      #
      # `--depth 1` fetches only the tags that point into the history it
      # fetched, and a depth-1 HEAD has no history for `--merged HEAD` to walk.
      # So both knobs, and the cost of both is the third column: about a second
      # and 2.4 MB more `.git` on a 47 MB repository. That is the whole price of
      # the release check being run rather than reported.
      #
      # The other half is in the test: with `CI` set, a missing tag premise is
      # now a **failure** rather than a skip, because on a runner the checkout
      # is this file's choice and not the environment's. Deleting either line
      # below turns that test red instead of quietly green.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # First, because it is the one failure that cannot be undone by a later
      # commit: this repository is public, its subject is other people's
      # transcripts, and a merged file that quotes somebody's live corpus is
      # published the moment it lands. `scripts/make-screens.sh` has asserted a
      # forbidden-string list over docs/screens/ and the README since phase 0;
      # this is that assertion over every tracked file. The script's own header
      # is where the rule for "real content" is written down, and its failure
      # output repeats it, so a red run teaches rather than just blocks.
      - name: no committed file carries real-corpus content
        # `--selftest` first, and not as a formality: T5.9 found that the guard
        # had never caught family (2) at all, and that a `/home/<user>/` path
        # walked straight past it. A guard nobody has watched fail is a guard
        # nobody has watched, so it proves it can fail before it is believed
        # when it passes.
        run: |
          python3 scripts/check-privacy.py --selftest
          python3 scripts/check-privacy.py

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: build
        run: pnpm build

      - name: typecheck
        run: pnpm typecheck

      - name: test
        run: pnpm test

      # The second SQLite driver, exercised by the whole suite rather than by a
      # test written about it.
      #
      # `better-sqlite3` is a native addon, and a Claude Code plugin install is
      # a git clone: no `pnpm install`, no build, no `node_modules`. So potsherd
      # falls back to `node:sqlite`, which is what makes a marketplace install
      # work at all (open item A). A fallback nobody exercises is the
      # phantom-flag failure this project has recorded six times — a path that
      # looks supported, succeeds, and does nothing — and the only evidence
      # worth having is the full suite passing on it.
      #
      # On both matrix versions, not just 24. `node:sqlite` arrived behind
      # `--experimental-sqlite` and was unflagged later, and the assumption that
      # "Node 22 does not have it" turned out to be false the moment somebody
      # ran it: 22.23.2 has it unflagged, measured in a fresh Debian container.
      # So the fallback is tested wherever it exists, and the runner's own Node
      # decides whether that is here.
      - name: test again on Node's own sqlite
        env:
          POTSHERD_SQLITE: node
        run: |
          if node -e "require('node:sqlite')" 2>/dev/null; then
            pnpm test
          else
            echo "$(node --version) has no unflagged node:sqlite — nothing to test"
          fi

      # `plugins/claude-code/dist/*.js` are generated files that are committed,
      # because a plugin install is a git clone and has no way to build them.
      # A stale one is a plugin that ships last release's behaviour under this
      # release's version number, so the build output has to match byte for
      # byte on every push — not only at a tag.
      - name: the vendored plugin bundles are the ones this build produces
        shell: bash
        run: |
          node scripts/vendor-plugin.mjs
          if ! git diff --exit-code -- plugins/; then
            echo
            echo "The bundles committed under plugins/*/dist/ are not what this"
            echo "source builds. Regenerate with:  pnpm build && pnpm vendor"
            exit 1
          fi

      # The fixture is committed; if regenerating it produces a different tree,
      # the generator and the fixture have drifted apart.
      - name: fixtures are reproducible
        run: |
          node tests/fixtures/make-fixtures.mjs
          git diff --exit-code -- tests/fixtures/claude

      # The readme and docs/screens/ publish the reference machine's numbers as
      # real output. They only stay real while the demo corpus still produces
      # them, so the generator checks itself and CI runs the check.
      - name: the demo corpus still hits its targets
        run: node scripts/make-demo-corpus.mjs

      # `plans/06` makes gate (a) of the ask evals the one that must be 100% or
      # the build fails, and `evals/ask-selftest.ts` is what proves the scorer
      # behind it: sixteen hand-built results, no model, no index, no `ask`,
      # each one required to fail the single gate it is named for. Nothing ran
      # it — not `pnpm test`, not CI — so a scorer that had stopped scoring
      # would have been found by a person reading output, if at all. It exits
      # non-zero when any case is judged wrongly.
      - name: the ask eval scorer still scores
        run: npx tsx evals/ask-selftest.ts

      # **VERIFICATION-5 C-11.** `grep -n evals .github/workflows/ci.yml` found
      # only the line above, so the retrieval gate — the one `evals/gate.ts`
      # calls "the amended phase-3 gate", whose floor is a ratchet fixed by a
      # recorded ruling — and its per-query alarm had never been evaluated
      # automatically. `pnpm test` does run the gate's *rule* over numbers
      # `tests/evals-gate.test.ts` writes itself, and it runs the whole eval end
      # to end **only where a 34 MB model is already cached**, which on a fresh
      # runner is nowhere. So the pipeline the release is judged on was checked
      # by a person, by hand, when they remembered.
      #
      # Wall time, measured on this repository (Apple silicon, warm and cold):
      #
      #   pnpm evals, model already cached      17.0 s   exit 0
      #   pnpm evals, empty POTSHERD_MODELS_DIR 24.3 s   exit 0   (46 MB fetched)
      #   pnpm evals -- --vector-weight 0       19.3 s   exit 1
      #
      # so this is one cold run per matrix job. If that ever stops being cheap,
      # the cheaper shape is `actions/cache` keyed on the model id rather than
      # dropping the step — a gate nobody runs costs more than 25 seconds.
      #
      # POTSHERD_EVALS_EMBED=1 is not optional and is the whole point. Without
      # a model on disk `evals/run.ts` drops the vector modes, prints `vector
      # modes skipped`, reports the phase-3 gate as `cannot be judged` — and
      # **exits 0**, because bm25 alone still clears the phase-1 gate. A green
      # tick meaning "not run" is the exact failure C-10 is about, one file
      # over, so the premise is asserted from the output rather than inferred
      # from the exit code: the vector modes must have run, and the gate must
      # have been judged and passed.
      #
      # The per-query alarm below the gate is deliberately NOT fatal — it is by
      # design a report and not a gate, and it currently names five losses and
      # two gains of tie-break drift against `evals/per-query-baseline.json`
      # with the aggregate unchanged. Running the step is what puts it in the
      # log, which is all it ever asked for.
      - name: the retrieval gate still passes, and was really judged
        shell: bash
        env:
          POTSHERD_EVALS_EMBED: '1'
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP:-/tmp}/evals.txt"
          # `set -e` + the pipe: the eval's own exit code is the gate, and it
          # must not be swallowed by `tee`.
          set -o pipefail
          pnpm evals 2>&1 | tee "$out"

          fail=0
          if grep -q 'vector modes skipped' "$out"; then
            echo "::error::the vector modes did not run, so there was no phase-3 gate to judge"
            fail=1
          fi
          if grep -q 'cannot be judged' "$out"; then
            echo "::error::the phase-3 gate was not judged in this run"
            fail=1
          fi
          # The wording moved when the gate was re-scoped in phase 11 to judge
          # both surfaces, and this grep did not move with it -- so the step
          # reddened on a run whose gate had passed, which is the "premise
          # asserted from the output" guard failing at its own job. Matched on
          # the stable half of the sentence now, and the sentence itself is
          # pinned by tests/evals-gate.test.ts so it cannot drift silently.
          if ! grep -q 'gate would merge this fusion' "$out"; then
            echo "::error::no PASS line from the retrieval gate"
            fail=1
          fi
          if [ "$fail" != 0 ]; then
            echo "pnpm evals exited 0 without evaluating what this step exists to evaluate."
            exit 1
          fi
          echo "the phase-3 gate ran, with vectors, and passed"

      # The privacy receipt is the one published artefact that can lie about
      # what the product does, and it has: `doctor --privacy` once said "no
      # network" after potsherd had started sending transcript text to a model.
      # It happened a second time, quietly. The live command was corrected in
      # phase 4 — it discloses `ask`, `graft` and the `./.potsherd/graft-<id8>.md`
      # write into your own project — but `docs/screens/05-doctor-privacy.txt`
      # and the copy of it in the readme were never regenerated, so the two
      # public copies went on naming only `card` and listing only the four
      # `~/.potsherd` paths for the whole of phase 4.
      #
      # Nothing caught it because nothing in CI has ever run
      # `scripts/make-screens.sh`. This step is the guard: it rebuilds the
      # receipt from the demo corpus with the same binary a user would run,
      # and fails if the committed screen or the readme has drifted from it.
      # The one-time correction was worth less than this step.
      - name: the published privacy receipt still matches the live one
        shell: bash
        run: |
          set -euo pipefail
          repo="$PWD"
          # XDG_CONFIG_HOME is cleared alongside HOME because opencode's config
          # path honours it. T5.5 flagged this as "insurance, not a live failure
          # on GitHub's runners" — it was live: the runner sets it, so opencode's
          # line resolved under the runner's own config directory, outside the
          # throwaway HOME, and could not be tildified while every other line
          # could. (The literal path is not written here: `check-privacy.py`
          # flags a `/home/<user>/…` shape wherever it appears, including in a
          # comment explaining why it appeared — which is the guard working.)
          #
          # `pwd -P` because on macOS /tmp is a symlink to /private/tmp: HOME would
          # be the symlinked path and the working directory the resolved one, and
          # `tildify` would then fail to fold the graft path back to `~`.
          home="$(cd "${RUNNER_TEMP:-/tmp}" && pwd -P)/privacy-receipt"
          rm -rf "$home"

          # Synthetic corpus, throwaway HOME. This repository is public and the
          # machine the numbers were measured on holds a named third party's
          # work, so no check here may ever touch a real ~/.claude.
          node scripts/make-demo-corpus.mjs "$home/.claude" >/dev/null

          # A stub `claude` on the demo PATH, for the same reason
          # scripts/make-screens.sh plants one: `--privacy` resolves which
          # binary would receive a call, and without this it would resolve to
          # whatever the runner image happens to have. It is never executed.
          mkdir -p "$home/.claude/local" "$home/work/demo-project"
          printf '#!/bin/sh\nexit 0\n' > "$home/.claude/local/claude"
          chmod +x "$home/.claude/local/claude"

          # The capture order from make-screens.sh, in miniature: `rescue`
          # first, because it is what creates ~/.claude/settings.json, and the
          # receipt reports whether that file is present.
          ( cd "$home" && env -u CLAUDE_CONFIG_DIR -u POTSHERD_DIR -u XDG_CONFIG_HOME HOME="$home" \
              node "$repo/packages/cli/bin/potsherd.js" rescue --yes >/dev/null )

          # From a project directory inside the demo HOME, because the graft
          # line is relative to the working directory and a capture run from
          # the checkout would print the runner's own path.
          ( cd "$home/work/demo-project" \
            && env -u CLAUDE_CONFIG_DIR -u POTSHERD_DIR -u XDG_CONFIG_HOME -u NO_COLOR -u FORCE_COLOR \
                 HOME="$home" PATH="$home/.claude/local:$PATH" \
                 node "$repo/packages/cli/bin/potsherd.js" \
                 doctor --privacy --width 80 --no-color ) > "$home/live.txt"

          # Two things in this receipt are real output that legitimately differ
          # between one capture and the next, so both are normalised rather than
          # pinned — the same reasoning, applied twice.
          #
          #   the heading date: today's, from the system clock.
          #
          #   the managed-settings path: **platform-dependent**. Claude Code
          #   reads it from /Library/Application Support/ClaudeCode on macOS and
          #   /etc/claude-code on Linux, so a screen captured on one OS could
          #   never match the live command on the other. This guard ran on both
          #   and failed on ubuntu for exactly that reason on its first outing.
          #   The line's *presence* is still asserted below; only the platform's
          #   own spelling of the path is normalised away.
          norm() {
            sed -E -e '1s/·[^·]*$/· <date>/' \
                   -e 's#^( *)[^ ].*managed-settings\.json#\1<managed-settings>#' "$1"
          }

          # ...and the line must still be there. A normaliser that silently
          # accepted its disappearance would be a guard that stopped guarding.
          grep -q 'managed-settings' docs/screens/05-doctor-privacy.txt || {
            echo "the privacy receipt no longer mentions managed-settings at all"; exit 1; }

          screen=docs/screens/05-doctor-privacy.txt
          if ! diff -u <(norm "$screen") <(norm "$home/live.txt"); then
            echo
            echo "The published privacy receipt no longer matches what the product does."
            echo "Above, '-' is what $screen claims and '+' is what the live"
            echo "command prints. Regenerate with:  bash scripts/make-screens.sh"
            exit 1
          fi

          # And the readme carries a verbatim copy of that same screen. A
          # correct screen beside a stale readme is the same defect with a
          # second address, so the copy is compared byte for byte.
          python3 - "$screen" README.md <<'PY'
          import pathlib, sys
          screen = pathlib.Path(sys.argv[1]).read_text().rstrip('\n').split('\n')
          lines = pathlib.Path(sys.argv[2]).read_text().split('\n')
          start = next((i for i, l in enumerate(lines)
                        if l.startswith('potsherd doctor --privacy ·')), None)
          if start is None:
              sys.exit('README.md no longer quotes the privacy receipt at all.')
          end = next(i for i in range(start, len(lines)) if lines[i].startswith('```'))
          quoted = lines[start:end]
          # The heading date is normalised here too, for the same reason.
          import re
          def norm(b):
              out = ['potsherd doctor --privacy · <date>']
              for line in b[1:]:
                  out.append(re.sub(r'^( *)\S.*managed-settings\.json',
                                    r'\1<managed-settings>', line))
              return out
          if norm(quoted) != norm(screen):
              import difflib
              print('\n'.join(difflib.unified_diff(
                  norm(screen), norm(quoted), 'docs/screens', 'README.md', lineterm='')))
              sys.exit("README.md's copy of the privacy receipt has drifted from the screen.")
          print(f'readme quotes the receipt verbatim ({len(quoted)} lines)')
          PY

          echo "the published privacy receipt matches the live command"

      # `docs/screens/04-doctor.txt` is the second published artefact that can
      # go on printing a number after it stopped being true, and it did: it
      # said `potsherd 0.1.0 · schema v4 of v4` for the whole of phases 2, 3
      # and 4, against a shipped 0.4.0 and eight migrations. Nothing caught it
      # because every *other* number on that screen is fixed by the demo corpus
      # and stayed right, so the screen looked current.
      #
      # These two are the only ones on it that describe the build rather than
      # the corpus, so they are the only ones that need a step of their own —
      # and this one needs no capture, no HOME and no corpus, which is why it
      # is a grep and not a rerun of scripts/make-screens.sh.
      - name: the published doctor screen names the shipped version and schema
        shell: bash
        run: |
          set -euo pipefail
          screen=docs/screens/04-doctor.txt
          version="$(node -p "require('./packages/cli/package.json').version")"
          schema="$(node -e 'import(process.argv[1]).then((m) => console.log(m.latestSchemaVersion()))' \
            "$PWD/packages/core/dist/db.js")"
          head -n1 "$screen"
          if ! head -n1 "$screen" | grep -qF "potsherd $version"; then
            echo "$screen publishes a version that is not the one this build ships ($version)."
            echo "Regenerate with:  bash scripts/make-screens.sh"
            exit 1
          fi
          if ! grep -qF "schema v$schema of v$schema" "$screen"; then
            echo "$screen publishes a schema version that is not v$schema, which is what the store migrates to."
            echo "Regenerate with:  bash scripts/make-screens.sh"
            exit 1
          fi
          echo "the doctor screen names potsherd $version and schema v$schema"

      # The two steps above guard `04-doctor.txt` and `05-doctor-privacy.txt`.
      # Nothing guarded the other fifteen, and it cost exactly what it looks
      # like it would: FIX-C deleted `no embeddings in the index — run potsherd
      # index --embed` from `core/recall.ts` because `index` embeds by default
      # and `--embed` only moves the same work into the foreground — and
      # `13-find-redacted.txt` went on publishing that instruction to every
      # reader of the readme, because the only way to notice was for a human to
      # run `make-screens.sh` and read the diff. "Documented and does nothing"
      # is a failure this project has now recorded nine times.
      #
      # So: rebuild the ten screens that are a single command and deterministic
      # given the demo corpus, and diff them against the committed copies. The
      # capture order is `make-screens.sh`'s own, because every screen reports
      # on the state the one before it left.
      #
      # ## what this step does NOT cover — open items, not boilerplate
      #
      #   - **Seven of the seventeen screens.** `14-ask`, `15-graft` and
      #     `17-ls-cards` need a model backend and carry model-written text.
      #     `16-before-after` is two commands and a shell listing, not one
      #     capture. `07-index` cannot be diffed here: `masked this run` counts
      #     what *this* pass masked and a second index over the same store
      #     masks fewer, and its `fetching 46.1 MB, once` line depends on
      #     whether the embedding model is already cached on the machine, which
      #     is a fact about the runner. `04` and `05` have the two steps above.
      #   - **Durations and the heading date**, normalised away below. A screen
      #     that published a wrong *number of milliseconds* would pass here.
      #     They are real measurements of the machine that captured them and
      #     move every run; pinning them would make this step a flake generator
      #     rather than a guard.
      #   - **Strings only a different corpus reaches.** This proves the
      #     committed screen is what this build prints *for the demo corpus*.
      #     A branch of the code the demo corpus never enters is not exercised
      #     by any screen and so is not covered by any screen diff.
      - name: the published screens still match what this build prints
        shell: bash
        run: |
          set -euo pipefail
          repo="$PWD"
          # A throwaway HOME, for the reason the privacy step above gives at
          # length: this repository is public and no check here may read, write
          # or render a real ~/.claude. `pwd -P` because /tmp is a symlink on
          # macOS and `tildify` folds only the resolved path back to `~`.
          #
          # **`$repo/.tmp/demo-home`, which is `scripts/make-screens.sh`'s own
          # path, and not `$RUNNER_TEMP/screens-live`** — C-8, and this is the
          # measurement that found it. Same build, same corpus, same sequence,
          # varying only where the throwaway HOME sits:
          #
          #   /tmp/psU/h                          521 pages   database 2.0 MB
          #   $repo/.tmp/demo-home                533 pages   database 2.1 MB
          #   <a 100-character-deeper scratch>    578 pages   database 2.3 MB
          #
          # sqlite packs the absolute paths of 228 transcripts into its pages,
          # so how deep the capture directory sits is worth about half a page
          # per character — a 57-page, 0.3 MB spread across the three above.
          # That is a fact about the machine and not about the build, which is
          # what a normaliser is allowed to hide; it is also most of the
          # 552-against-533 divergence this step used to blame on capture order.
          # Standing where the script stands removes it: what is left is the
          # length of the checkout path itself, which differs between the linux
          # and macos runners by a character — about one page, well inside a
          # tenth of a megabyte. `rm -rf` first, as the script does, so a leftover from a local
          # `make-screens.sh` run cannot be what this compares against.
          home="$(cd "$repo" && pwd -P)/.tmp/demo-home"
          rm -rf "$home"
          node scripts/make-demo-corpus.mjs "$home/.claude" >/dev/null

          # --width 80 --no-color on every capture, as make-screens.sh does:
          # these are a fixed 80-column artefact, not whatever the runner's
          # terminal claims to be.
          #
          # TZ=UTC, and this is the whole reason this step was red on both
          # ubuntu jobs the first time it ran. Every date and time on these
          # screens is rendered with local-time getters (`core/format.ts`), so
          # a corpus timestamp near midnight renders a day earlier on a UTC
          # runner than on a laptop at UTC+05:30 — `08-ls`, `11-show` and
          # `12-ls-ghosts` drifted by one day on some rows and not others. The
          # corpus is not the problem: it is byte-identical in any zone, its
          # instants pinned to a literal `ANCHOR` in make-demo-corpus.mjs. It
          # is the rendering. `scripts/make-screens.sh` pins the same zone at
          # the top for the same reason, and the two must never disagree.
          #
          # POTSHERD_OFFLINE=1 and --no-embed below are not redundant with each
          # other. `index` spawns a detached, unref'ed background embedder with
          # no kill path (`cli/src/commands/index.ts:258`, measured in FIX-E
          # §4): OFFLINE makes that child give up instead of fetching 46.1 MB,
          # but the parent's decision to spawn never consults it, so a process
          # is still started and the fourth verifier found five of them alive
          # with PPID 1 after a handful of runs. `--no-embed` is what stops one
          # being started at all. A guard must not be a new producer of a lane
          # the product cannot stop — four matrix jobs, four unowned processes,
          # every run. Neither flag changes a screen this step compares; both
          # were checked with and without.
          run() {
            ( cd "$home" \
              && env -u CLAUDE_CONFIG_DIR -u POTSHERD_DIR -u XDG_CONFIG_HOME -u NO_COLOR -u FORCE_COLOR \
                   HOME="$home" POTSHERD_OFFLINE=1 TZ=UTC \
                   node "$repo/packages/cli/bin/potsherd.js" "$@" --width 80 --no-color )
          }

          # The three things on these screens that are real output and
          # legitimately differ between one capture and the next — and nothing
          # else.
          #
          # The third is `stats`' database size. FIX-E round 2 fixed the
          # measurement — `page_count * page_size` instead of
          # `fs.statSync(...).size`, so a WAL checkpoint no longer moves it —
          # and that was right and it was not enough. Measured on this repo,
          # same demo corpus, same build, two capture orders: **552 pages
          # against 533**, with identical row counts (439 exchanges, 228
          # sessions, 299 ghosts, 2,971 prompts, 0 vectors, 0 cards) and an
          # empty freelist in both. It rounded across the 2.1/2.2 MB boundary
          # and this step went red on `da13b2f` for a screen nobody had touched.
          #
          # **VERIFICATION-5 C-8**, and it is two findings against what was done
          # about that, both of which are answered above and here.
          #
          #   1. The justification was that this step's sequence "is a miniature
          #      of `scripts/make-screens.sh`'s, not a copy of it". That is
          #      precisely the point: the digit two honest runs disagreed about
          #      was a fact about **two different capture sequences**, one of
          #      which this guard wrote itself — a fact about the build, not
          #      about the machine, and the rule is that a normaliser may only
          #      hide the latter. So the sequence below is now the script's own,
          #      captured in the script's own order, with `16-before-after`'s
          #      `ls --limit 5 --width 76` and `ls --ghosts only` run between
          #      `index` and `stats` exactly where the script runs them. The one
          #      deliberate difference left is `--no-embed`, which stays for the
          #      reason given above: the script's `index --full` starts a
          #      detached embedder and then kills it by the pid the child wrote,
          #      and a guard on four matrix jobs must not be a new producer of a
          #      lane the product cannot stop. Measured with and without: it
          #      does not move a page.
          #
          #   2. `[0-9.]+ [kMG]?B` matched anything, so the published `2.1 MB`
          #      was unverified in **magnitude** as well as in digit — a `stats`
          #      that started printing `2.1 kB` or `2.1 GB` passed. The
          #      replacement hides **one character**: the tenths digit, and only
          #      when the value is written as `<int>.<tenth> <unit>`. The
          #      integer part and the unit are compared as normal.
          #
          # So what this normaliser can still hide, exactly and only: a drift of
          # under 0.1 MB in the size of the demo index — about 25 sqlite pages —
          # that does not cross the megabyte. `2.1 -> 2.9 MB` passes; `2.1 ->
          # 3.0 MB`, `2.1 -> 2.1 kB`, `2.1 -> 2.1 GB`, `2.1 -> 21 MB` and a
          # `database` row that vanishes, moves or names the wrong file all
          # fail. Seeded and shown red in phases/phase-10/FIX-J-REPORT.md §2.
          #      A THIRD THING THIS HIDES, ADDED 25 AUG. The heading date was
          #      normalised on line 1 only, and two covered screens carry the
          #      capture day in their BODY: `03-audit-after.txt`'s `last rescue
          #      <day>` and `10-stats.txt`'s `indexed <day>`. Both are written by
          #      the capture run itself, so both were correct on the day they
          #      were regenerated and wrong every day after -- a guard that goes
          #      red tomorrow for a reason nobody changed. It did, and this is
          #      the fix. The day a rescue ran is a fact about the machine's
          #      clock, which is what a normaliser is allowed to hide; the rest
          #      of both lines -- the counts, the sizes, the words -- is compared
          #      as normal, and a screen that stopped printing the clause at all
          #      still fails.
          norm() {
            sed -E -e 's/[0-9]+ms/<ms>/g' \
                   -e '1s/· [0-9]+ [a-z]+ [0-9]{4}$/· <date>/' \
                   -e 's/last rescue [0-9]+ [a-z]+ [0-9]{4}/last rescue <date>/' \
                   -e 's/^(  indexed +)[0-9]+ [a-z]+/\1<date>/' \
                   -e 's/^(  database +[0-9]+)\.[0-9]( +[kMG]?B)/\1.<tenth>\2/' "$1"
          }

          status=0
          check() {
            local screen="docs/screens/$1"; shift
            run "$@" > "$home/live.txt"
            if diff -u <(norm "$screen") <(norm "$home/live.txt") > "$home/diff.txt"; then
              echo "  ok        $screen"
            else
              echo "  DRIFTED   $screen  <-  potsherd $*"
              cat "$home/diff.txt"
              status=1
            fi
          }

          # `scripts/make-screens.sh`'s capture order, verbatim and in full —
          # C-8, and see the note over `norm()`. Audit before rescue and again
          # after; nothing that reads the index before `index` built it; and the
          # two captures between `index` and `stats` that this step used to skip
          # because it does not diff their screens. It runs them anyway: what
          # `stats` reports on is the state every command before it left, and a
          # guard that reports on a *different* state than the artefact it is
          # checking is measuring its own sequence.
          #
          # `10-stats.txt` must therefore stay where it is relative to the four
          # reads above it. Moving any line in this block is a change to what
          # the next line prints.
          check 01-audit.txt         audit
          check 06-audit-sweep.txt   audit --sweep
          check 02-rescue.txt        rescue --yes
          check 03-audit-after.txt   audit
          run index --full --no-embed >/dev/null
          check 08-ls.txt            ls
          # 16-before-after.txt is a here-doc of two commands in the script and
          # is not diffed here, but the potsherd half of it is a real read of
          # this index, in this position. Not through `run()`, which appends its
          # own `--width 80`: the script shoots this one at `--width 76`, and a
          # guard that reproduces a sequence reproduces the sequence. Discarded.
          ( cd "$home" \
            && env -u CLAUDE_CONFIG_DIR -u POTSHERD_DIR -u XDG_CONFIG_HOME -u NO_COLOR -u FORCE_COLOR \
                 HOME="$home" POTSHERD_OFFLINE=1 TZ=UTC \
                 node "$repo/packages/cli/bin/potsherd.js" ls --limit 5 --width 76 --no-color ) >/dev/null
          check 12-ls-ghosts.txt     ls --ghosts only
          check 09-find.txt          find pgbouncer
          check 10-stats.txt         stats
          check 11-show.txt          show 9c4d2f18
          check 13-find-redacted.txt find redacted

          if [ "$status" != 0 ]; then
            echo
            echo "A published screen is not what this build prints. Above, '-' is what"
            echo "the committed screen claims and '+' is what the command actually says."
            echo "Regenerate with:  bash scripts/make-screens.sh"
            exit 1
          fi
          echo "ten published screens match what this build prints"

      # audit must agree with the standalone verifier on any corpus, including
      # an empty one and the committed fixture.
      - name: audit agrees with verify-audit.py
        shell: bash
        run: |
          node packages/cli/bin/potsherd.js audit --json \
            --claude-dir tests/fixtures/claude > /tmp/potsherd.json
          python3 scripts/verify-audit.py --json \
            --claude-dir tests/fixtures/claude > /tmp/verify.json
          node -e '
            const a = require("/tmp/potsherd.json");
            const b = require("/tmp/verify.json");
            // sidechainFiles is in the list on purpose: a subagent transcript
            // must never be counted as a session, under either layout.
            for (const k of ["sessionsEver","onDisk","deleted","promptsLost","promptsSurviving","sidechainFiles"]) {
              if (a[k] !== b[k]) {
                console.error(`${k}: potsherd ${a[k]} vs verify ${b[k]}`);
                process.exit(1);
              }
            }
            console.log("agree:", JSON.stringify(b));
          '

      # The honesty contract: the python audit --verify prints must recompute
      # the same four numbers, on a machine with no checkout.
      - name: audit --verify recomputes the same numbers
        shell: bash
        run: |
          node packages/cli/bin/potsherd.js audit --verify --json \
            --claude-dir tests/fixtures/claude \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["snippet"])' > /tmp/snippet.sh
          CLAUDE_CONFIG_DIR=tests/fixtures/claude sh /tmp/snippet.sh > /tmp/snippet.out
          cat /tmp/snippet.out
          python3 - <<'EOF'
          import json, re
          got = dict((m.group(1).strip(), int(m.group(2)))
                     for m in (re.match(r"^(.*?)\s+(\d+)$", l.strip())
                               for l in open("/tmp/snippet.out")) if m)
          want = json.load(open("/tmp/potsherd.json"))
          pairs = [("sessions ever started", "sessionsEver"), ("still on disk", "onDisk"),
                   ("deleted", "deleted"), ("prompts lost", "promptsLost")]
          for label, key in pairs:
              assert got[label] == want[key], (label, got[label], want[key])
          print("audit --verify agrees:", got)
          EOF

      - name: audit is safe on a machine with no claude code at all
        shell: bash
        run: |
          node packages/cli/bin/potsherd.js audit --claude-dir /tmp/nope
          node packages/cli/bin/potsherd.js audit --json --claude-dir /tmp/nope | grep '"deleted": 0'

      # The whole promise of `npx potsherd audit` is that the published tarball
      # runs on a clean machine with nothing but node.
      - name: npx from the packed tarball
        shell: bash
        run: |
          cd packages/cli
          npm pack --silent
          TARBALL="$(ls potsherd-*.tgz)"
          WORK="$(mktemp -d)"
          cp "$TARBALL" "$WORK/"
          cd "$WORK"
          npm init -y >/dev/null
          npm install --silent "./$TARBALL"
          ./node_modules/.bin/potsherd audit
          ./node_modules/.bin/potsherd --version
